<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Новая вкладка</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="ide-shell">
    <header class="ide-header">
        <div class="window-controls" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="project-title">
            <span class="product-mark">ST</span>
            <span>Search Tab</span>
        </div>

        <div class="header-actions"></div>
    </header>

    <main class="ide-main ide-main--tool-window-collapsed">
        <aside class="tool-window" aria-label="Навигация">
            <div class="tool-window-title">
                <span class="js-tool-window-title">Bookmarks</span>
                <button class="tool-window-toggle js-tool-window-toggle" type="button" aria-label="Свернуть навигацию">‹</button>
            </div>

            <div class="project-tree js-bookmarks-tree"></div>
            <div class="tool-window-resizer js-tool-window-resizer" role="separator" aria-label="Изменить ширину навигации"></div>
        </aside>

        <button class="tool-window-stripe js-tool-window-stripe" type="button" aria-label="Развернуть навигацию">
            Bookmarks
        </button>

        <section class="editor-area" aria-label="Рабочая область">
            <div class="editor-tabs" role="tablist" aria-label="Вкладки редактора">
                <button class="editor-tab editor-tab--active js-editor-tab" type="button" role="tab" aria-selected="true" data-tab="search">
                    <span class="tab-icon tab-icon--php" aria-hidden="true"></span>
                    <span class="tab-title">search.php</span>
                    <span class="tab-close" aria-hidden="true"></span>
                </button>
                <button class="editor-tab js-editor-tab" type="button" role="tab" aria-selected="false" data-tab="settings">
                    <span class="tab-icon tab-icon--json" aria-hidden="true"></span>
                    <span class="tab-title">settings.json</span>
                    <span class="tab-close" aria-hidden="true"></span>
                </button>
            </div>

            <div class="editor-pane editor-pane--active js-editor-pane" data-pane="search">
                <div class="workspace workspace--search js-search-workspace">
                    <section class="search-popup js-search-popup" aria-label="Поиск">
                        <div class="search-popup-header">
                            <span>Search Everywhere</span>
                            <span class="shortcut-key">Double Shift</span>
                        </div>

                        <form class="search-form js-search-form" action="https://yandex.ru/search/" method="GET">
                            <span class="search-icon" aria-hidden="true"></span>

                            <input
                              class="search-input js-search-input"
                              name="text"
                              type="search"
                              placeholder="Type to search"
                              autocomplete="off"
                              required
                              autofocus
                            />

                        </form>

                        <div class="search-filters js-search-engine-filters" aria-label="Фильтры поисковика"></div>
                        <div class="search-suggestions js-search-suggestions" aria-label="Результаты поиска"></div>
                    </section>
                </div>
            </div>

            <div class="editor-pane js-editor-pane" data-pane="settings">
                <div class="workspace workspace--settings">
                    <section class="settings-panel" aria-label="Настройки">
                        <div class="settings-group">
                            <label class="settings-field">
                                <span class="settings-label">Theme</span>
                                <select class="settings-select js-theme-select" aria-label="Выбор темы интерфейса">
                                    <option value="islands-dark" selected>Islands Dark</option>
                                    <option value="islands-light">Islands Light</option>
                                    <option value="islands-darcula">Islands Darcula</option>
                                    <option value="dark">Dark</option>
                                    <option value="light">Light</option>
                                    <option value="light-header">Light with Light Header</option>
                                    <option value="darcula">Darcula</option>
                                    <option value="high-contrast">High Contrast</option>
                                </select>
                            </label>

                            <label class="settings-field">
                                <span class="settings-label">Default Search Engine</span>
                                <select class="settings-select js-default-search-engine-select" aria-label="Поисковик по умолчанию"></select>
                            </label>

                            <label class="settings-field">
                                <span class="settings-label">UI Font Size</span>
                                <select class="settings-select js-ui-font-size-select" aria-label="Размер шрифта интерфейса">
                                    <option value="compact">Compact</option>
                                    <option value="default" selected>Default</option>
                                    <option value="large">Large</option>
                                    <option value="extra-large">Extra Large</option>
                                </select>
                            </label>

                            <label class="settings-field">
                                <span class="settings-label">UI Font Family</span>
                                <select class="settings-select js-ui-font-family-select" aria-label="Семейство шрифта интерфейса">
                                    <option value="system" selected>System</option>
                                    <option value="inter">Inter</option>
                                    <option value="segoe">Segoe UI</option>
                                    <option value="arial">Arial</option>
                                    <option value="mono">Monospace</option>
                                </select>
                            </label>

                            <div class="settings-field">
                                <span class="settings-label">UI Settings</span>
                                <button class="settings-button js-reset-search-popup-layout" type="button">
                                    Reset All
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="bookmark-context-menu js-bookmark-context-menu" role="menu" hidden></div>

<script src="search.js"></script>
</body>
</html>
